<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <circle cx="64" cy="64" r="48" fill="none" stroke="#1e293b" stroke-width="2" />
  
  <!-- Antigravity orbital rings -->
  <ellipse cx="64" cy="64" rx="42" ry="18" fill="none" stroke="url(#glowGrad)" stroke-width="3" transform="rotate(-25 64 64)" filter="url(#glow)" opacity="0.85" />
  <ellipse cx="64" cy="64" rx="42" ry="18" fill="none" stroke="url(#glowGrad)" stroke-width="2" transform="rotate(35 64 64)" opacity="0.6" />
  
  <!-- Antigravity Delta / A Core -->
  <path d="M64 28 L90 88 L76 88 L64 60 L52 88 L38 88 Z" fill="url(#glowGrad)" filter="url(#glow)" />
  <circle cx="64" cy="74" r="4" fill="#38bdf8" />
</svg>